---
name: memory-shaper
version: 1.4.2
description: "Enforces the dynamic-memory architecture. Keeps MEMORY.md as a flat keyword index and routes verbose content to ~/.hermes/memories/<topic>.md. Validates index-line format (Unicode arrow only, bare .md targets, 5-20 lowercase keywords), rejects human-language prose via a comma-to-word ratio check, and blocks every non-memory tool that would write to MEMORY.md — while always allowing reads so the agent can audit the index it maintains."
author: ockentap
license: Apache-2.0

hooks:
  - pre_tool_call
provides_hooks:
  - pre_tool_call
