---
name: memory-shaper
version: 1.5.0
description: "Enforces the dynamic-memory architecture. Keeps the memory index as a flat keyword table and routes verbose content to ~/.hermes/memories/<topic>.md. Validates index-line format (Unicode arrow only, bare .md targets, 5-20 lowercase keywords), rejects human-language prose via a comma-to-word ratio check, ignores the § separator lines the built-in memory store inserts between entries, refuses any remove/replace/patch whose old_text lands inside the index header — on the stock store the header is a single §-joined entry, so such an edit rewrites the whole preamble — unless the user approves a rewrite, deletes only the template's own placeholder lines and only while they still match the shipped template text, and blocks the recognised write paths of non-memory tools that would touch the index (best-effort against arbitrary shell) — while always allowing reads so the agent can audit the file it maintains."
author: ockentap
license: Apache-2.0
requires_hermes: ">=0.22.2"

hooks:
  - pre_tool_call
provides_hooks:
  - pre_tool_call
provides_middleware:
  - tool_execution
