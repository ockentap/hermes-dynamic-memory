---
name: dynmem
version: 1.12.0
description: "Enforces the dynamic-memory architecture. Keeps the memory index as a flat keyword table and routes verbose content to ~/.hermes/memories/<topic>.md. Validates index-line format (Unicode arrow only, bare .md targets, 5-20 lowercase keywords), rejects human-language prose via a comma-to-word ratio check, ignores the § separator lines the built-in memory store inserts between entries, refuses any remove/replace/patch whose old_text lands inside the index header — on the stock store the header is a single §-joined entry, so such an edit rewrites the whole preamble — unless the user approves a rewrite, deletes only the template's own placeholder lines and only while they still match the shipped template text, and blocks the recognised write paths of non-memory tools that would touch the index (best-effort against arbitrary shell) — while always allowing reads so the agent can audit the file it maintains. Writes one absolute 'All memories are located in:' line into the header (per-profile path, filled by the plugin, idempotent, backed up once to state/) so index entries stay bare filenames and a recall is one direct read instead of a directory hunt. Off by default; when enabled with plugins.entries.dynmem.settings.memcheck.enabled: true, appends a hidden tagged self-report to the first four user messages of a session asking which memory files were read, which were nearly read, and whether the routing turned out wrong. The transform hook is registered with hold_stream so the tag never streams to the user; the tag is stripped before the reply is stored or shown and every claim (filename, keyword, quoted fact) is checked against the index and the topic file body. Samples go to $HERMES_HOME/state/memcheck/samples.jsonl (tag fields plus the first 400 characters of the user message) and rotate at 5 MiB, keeping one previous window as samples.jsonl.1; MEMCHECK_DISABLED=1 kills it for one process."
author: ockentap
license: Apache-2.0
requires_hermes: ">=0.22.2"

hooks:
  - pre_tool_call
  - pre_llm_call
  - transform_llm_output
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - transform_llm_output
provides_middleware:
  - tool_execution

config_schema:
  profile:
    type: str
    default: ""
    description: "What to optimise for. requests = one flat index, one read per recall, more resident tokens (cheapest in round-trips, stops scaling past ~50-60 memories). tokens = tiered index (index -> synapses -> engrams), 2-3 reads per recall, far fewer tokens (scales to hundreds). Ask the user once at setup: skill-install/SKILL.md section 0.5. Empty = not asked yet."
  memcheck:
    type: bool
    default: false
    description: "Opt-in memory-relevance self-report on the first four turns of a session. Costs output tokens; see docs/memcheck.md. (Read as memcheck.enabled through the plugin's settings tree.)"
